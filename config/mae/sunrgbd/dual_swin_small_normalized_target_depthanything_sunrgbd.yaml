experiment_type: "mae"
experiment_dataset: "sunrgbd"
experiment_name: "dual_swin_small_normalized_target_depthanything"
# Model
model:
  name: "dual_swinmae_s"
  params:
    norm_pix_loss: True
    target_type: "rawDepthAnything"
train:
  # Runner
  num_epochs: 4000
  start_saving_epoch: 600
  saving_interval: 40
  max_iter: ~
  log_iter: ~
  eval_iter: ~
  runner_name: mae
  distributed: False
  device: cuda:0
  resume: ~

  # Dataloader
  batch_size: 32
  num_workers: 64
  drop_last: True

  # Hyperparameter
  mask_ratio: 0.75
  accum_iter: 4
  warmup_epochs: 40
  lr: 1.5e-04
  min_lr: 1.0e-05
  weight_decay: 0.01


  # Dataset
  dataset:
    name: "sunrgbd"
    params:
      root: "data/sunrgbd_trainval"
      split: "train"

    common_transforms:
      random_resized_crop:
        params:
          size: [224, 224]
          scale: [0.2, 1.0]
          interp_mode: 3
      random_mirror:
        params:
          p: 0.5

    transforms:
      to_tensor:
        params: ~
      normalize:
        params:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

          # sunrgbd rgb
          # mean: [0.4960, 0.4686, 0.4415]
          # std: [0.2781, 0.2865, 0.2917]
    depth_transforms:
      to_tensor:
        params: ~

      # normalize:
      #   params:
      #     # sunrgbd depth
      #     mean: [0.4132, 0.4132, 0.4132]
      #     std: [0.2703, 0.2703, 0.2703]

    target_transforms:
      to_tensor:
        params: ~
      normalize:
        params:
          # sunrgbd depth anything
          mean: [0.4975, 0.4975, 0.4975]
          std: [0.2218, 0.2218, 0.2218]
    label_transforms: ~

  # Losses
  losses:
    ~
    # loss:
    #   type: native_scaler
    #   weight: 1.0
    #   params: ~

  # Optimizer
  opt_params:
    lr_default: 1.5e-04
    wd_default: 0.01
    betas: (0.9, 0.95)
    momentum: ~
    lr_list: ~
    group_keys: ~
    wd_list: ~

  opt_name: "adamw"
  scheduler_name: "constant"
  # Logger
  use_tensorboard: True
  tensorboard_folder:
  log_dir: log/
  output_dir: output_dir/
  model_folder: ~

